# NSA310S – zapora npf (listy adresów w /etc/npf.d/ zarządzane przez panel WWW)
set bpf.jit off

# sieci z dostępem do ssh i panelu WWW
table <dom> type lpm file "/etc/npf.d/dom"
# klienci udziałów NFS (generowane z /etc/exports)
table <nfs> type lpm file "/etc/npf.d/nfs"

group default {
	pass final on lo0 all
	pass stateful out final all

	pass in final family inet4 proto icmp all
	pass in final family inet6 proto ipv6-icmp all

	pass stateful in final proto tcp from <dom> to any port { 22, 80, 443 }

	# NFSv3: rpcbind 111, nfsd 2049, mountd 4002 (mountd_flags="-p 4002")
	pass stateful in final proto tcp from <nfs> to any port { 111, 2049, 4002 }
	pass stateful in final proto udp from <nfs> to any port { 111, 2049, 4002 }

	# DHCP (odnowienie dzierżawy unicastem)
	pass in final proto udp from any port 67 to any port 68

	block in all
}
