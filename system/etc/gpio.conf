# Zyxel NSA310S – diody (Linux DTS kirkwood-nsa310s, wszystkie aktywne wysokim)
gpio0 13 set out hdd_red
gpio0 15 set out usb_green
gpio0 16 set out hdd_green
gpio0 22 set out copy_green
gpio0 23 set out copy_red
gpio0 28 set out sys_green
gpio0 29 set out sys_orange
# przyciski (tylko odczyt): reset 24, copy 25 – aktywne niskim, power 26 – wysokim
gpio0 24 set in btn_reset
gpio0 25 set in btn_copy
gpio0 26 set in btn_power
