#	NSA310S
#
#	Zyxel NSA310S (Marvell 88F6702 Kirkwood, 1GHz, 256MB, 1x SATA, 1x GbE,
#	RTC Holtek HT1382 on i2c-0 @ 0x68). Based on MARVELL_NAS.
#	Boot with the stock Zyxel U-Boot (1.1.x): use netbsd-NSA310S-old.ub.

include 	"arch/evbarm/conf/MARVELL_NAS"

options 	EVBARM_BOARDTYPE=nsa310s
options 	MSGBUFSIZE=32768

no options 	ORION		# Kirkwood only

# poprawki płyty w marvell_machdep.c: PHY 88E1318S zostawiony przez firmware
# na stronie 3 (przełącz na 0), wyłączanie zasilania przez GPIO27
makeoptions	CPPFLAGS+="-DNSA310S"

# zegar Holtek HT1382 z alarmem budzenia
htrtc0	at iic0 addr 0x68
